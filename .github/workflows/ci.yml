name: CI

# The suite is the only thing standing between a tuning tweak and a broken
# build, and a jam submission gets judged on the deployed commit. Run the same
# checks locally and here: tsc for types, Vitest for the 166 gameplay,
# leaderboard, i18n, boot and share tests, and a real production bundle so a bundling
# failure is caught on push instead of at deploy time.
on:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run the test suite
        run: npm test

      - name: Build the production bundle
        run: npm run build
