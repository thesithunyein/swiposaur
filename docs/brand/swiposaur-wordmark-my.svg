<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title description">
  <title id="title">ဆွီပိုဆောရပ်စ် — အမြီးရိုက် အရူးအမူး</title>
  <desc id="description">Burmese-script Swiposaur Tail Frenzy wordmark with dinosaur crest and tropical leaves on a transparent background.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ad" />
      <stop offset=".42" stop-color="#ffdf42" />
      <stop offset="1" stop-color="#f69a08" />
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80" />
      <stop offset="1" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="crest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185" />
      <stop offset="1" stop-color="#dc2626" />
    </linearGradient>
    <filter id="soft-shadow" x="-.15" y="-.2" width="1.3" height="1.5">
      <feDropShadow dx="0" dy="10" stdDeviation="3" flood-color="#180a04" flood-opacity=".7" />
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@700;800;900&display=swap');
      .myanmar { font-family: 'Aka08', 'Noto Sans Myanmar', 'Myanmar Text', 'Padauk', sans-serif; }
    </style>
  </defs>
  <!-- Tropical leaves and dinosaur crest frame the wordmark without a panel or backdrop. -->
  <g stroke-linejoin="round">
    <path d="M102 155C40 121 38 65 70 39C111 58 130 101 135 142C151 111 185 99 213 119C190 157 151 178 102 155Z" fill="url(#leaf)" stroke="#064e3b" stroke-width="8" />
    <path d="M858 155C920 121 922 65 890 39C849 58 830 101 825 142C809 111 775 99 747 119C770 157 809 178 858 155Z" fill="url(#leaf)" stroke="#064e3b" stroke-width="8" />
    <path d="M480 12 522 104 438 104Z" fill="url(#crest)" stroke="#450a0a" stroke-width="9" />
    <path d="M354 43 394 120 314 120Z" fill="url(#crest)" stroke="#450a0a" stroke-width="8" />
    <path d="M606 43 646 120 566 120Z" fill="url(#crest)" stroke="#450a0a" stroke-width="8" />
    <path d="M250 77 284 135 216 135Z" fill="url(#crest)" stroke="#450a0a" stroke-width="7" />
    <path d="M710 77 744 135 676 135Z" fill="url(#crest)" stroke="#450a0a" stroke-width="7" />
  </g>
  <g text-anchor="middle" class="myanmar" font-weight="900" paint-order="stroke fill" filter="url(#soft-shadow)">
    <text x="480" y="184" font-size="102" letter-spacing="1" fill="#180a04" stroke="#180a04" stroke-width="32">ဆွီပိုဆောရပ်စ်</text>
    <text x="480" y="175" font-size="102" letter-spacing="1" fill="#78350f" stroke="#78350f" stroke-width="23">ဆွီပိုဆောရပ်စ်</text>
    <text x="480" y="165" font-size="102" letter-spacing="1" fill="url(#gold)" stroke="#713b10" stroke-width="9">ဆွီပိုဆောရပ်စ်</text>
  </g>
  <text x="480" y="264" text-anchor="middle" class="myanmar" font-size="40" font-weight="800" letter-spacing="1" fill="#fff7dc" stroke="#541b07" stroke-width="7" paint-order="stroke fill">★ အမြီးရိုက် အရူးအမူး ★</text>
</svg>
